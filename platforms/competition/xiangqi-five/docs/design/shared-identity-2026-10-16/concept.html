<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  /><title>象五子棋 · 资料效果图</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #fff8e8;
      color: #365f45;
      font:
        15px/1.5 system-ui,
        'Microsoft YaHei',
        sans-serif;
    }
    .phone {
      width: 390px;
      min-height: 844px;
      padding: 24px 18px 22px;
    }
    header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 24px;
    }
    header strong {
      font-size: 21px;
    }
    .hero {
      text-align: center;
      padding: 20px 0;
    }
    .avatar {
      display: inline-grid;
      place-items: center;
      flex: none;
      width: 52px;
      height: 52px;
      background: #365f4518;
      border: 2px solid #fff;
      border-radius: 50%;
      font-size: 22px;
      color: #365f45;
      font-weight: 800;
    }
    .hero > .avatar {
      width: 94px;
      height: 94px;
      font-size: 36px;
    }
    h1 {
      font-size: 26px;
      margin: 12px 0 3px;
    }
    h2 {
      font-size: 25px;
      letter-spacing: 2px;
    }
    h3 {
      font-size: 16px;
      margin: 10px 0 3px;
    }
    p {
      margin: 8px 0;
      color: #365f45b0;
    }
    small {
      font-size: 12px;
      color: #365f45b0;
      display: block;
    }
    section {
      padding: 16px;
      border: 1px solid #bc655166;
      background: #ffffff77;
      border-radius: 19px;
      margin: 12px 0;
    }
    input {
      width: 100%;
      min-height: 48px;
      margin: 8px 0;
      padding: 10px 12px;
      border: 1px solid #365f4544;
      border-radius: 12px;
      background: #fffdf7;
      color: #365f45;
      font: inherit;
    }
    button {
      width: 100%;
      min-height: 48px;
      border: 1px solid #bc6551;
      border-radius: 14px;
      background: #bc6551;
      color: #fff;
      font: 700 16px system-ui;
      margin-top: 16px;
    }
    .quiet {
      background: #fffdf7;
      color: #365f45;
    }
    .meta strong {
      font-size: 13px;
    }
    .meta p {
      margin: 3px 0 12px;
    }
    details {
      font-size: 12px;
      padding: 14px 4px;
    }
    .duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .duo section {
      text-align: center;
      padding: 15px 8px;
      margin: 5px 0;
    }
    .duo h3 {
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .duo small {
      font-size: 10px;
    }
    .row {
      display: flex;
      gap: 9px;
      align-items: center;
      min-height: 75px;
      border-bottom: 1px solid #365f4522;
    }
    .row:last-child {
      border: 0;
    }
    .row .avatar {
      width: 38px;
      height: 38px;
      font-size: 17px;
    }
    .copy {
      min-width: 0;
      flex: 1;
    }
    .copy strong {
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .copy small {
      font-size: 11px;
    }
    .mine {
      background: #365f450c;
    }
    .mine small {
      font-size: 13px;
    }
    .mine h1 {
      font-size: 34px;
    }
  </style>
  <main class="phone" id="app"></main>
  <script>
    const pages = {
      profile:
        '<header>‹ <strong>玩家资料</strong><span></span></header><div class="hero"><span class="avatar">巡</span><h1>巡游玩家</h1><p>游客身份 · 当前浏览器保存</p></div><section><label>你的昵称<input value="巡游玩家"></label><small>2–16 个字，修改后仍保留成绩</small><button>保存昵称</button></section><section class="meta"><strong>资料来源</strong><p>由你提供</p><strong>资料地区</strong><p>未提供</p></section><details><summary>查看我的玩家 ID</summary><p>系统分配的账号编号，不能用于登录。</p></details>',
      room: '<header>‹ <strong>好友已就位</strong><span>?</span></header><div class="hero"><h1>一起比一局</h1><p>房间码 · 分享给好友</p><h2>6A3F 92B1 0C58</h2></div><div class="duo"><section><span class="avatar">巡</span><h3>巡游玩家（你）</h3><small>资料地区：中国 · 上海</small><p>已准备</p></section><section><span class="avatar">林</span><h3>林间伙伴</h3><p>等待准备</p></section></div><section><h3>自由对战</h3><p>双方准备后开始</p><button>准备好了</button></section><button class="quiet">返回主页</button>',
      board:
        '<header>‹ <strong>全站榜</strong><span></span></header><div class="hero"><h1>好友对战榜</h1><p>有效对战 · 累计积分</p></div><section class="mine"><small>我的成绩 · 全站第 2 名</small><h1>6分</h1><p>再来一局，继续和好友较量</p></section><section><div class="row"><span class="avatar">林</span><div class="copy"><strong>林间伙伴</strong></div><b>9分</b></div><div class="row"><span class="avatar">巡</span><div class="copy"><strong>巡游玩家</strong><small>资料地区：中国 · 上海</small></div><b>6分</b></div><div class="row"><span class="avatar">路</span><div class="copy"><strong>路过的新玩家</strong></div><b>3分</b></div></section><button class="quiet">返回游戏</button>',
    };
    document.getElementById('app').innerHTML =
      pages[new URL(location.href).searchParams.get('page') || 'profile'];
  </script>
</html>
