<!doctype html><meta charset="utf-8" /><title>Tap 好友联机 · 实施前概念</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: #dfe7d6;
    color: #343b31;
    font: 16px sans-serif;
    display: flex;
    gap: 24px;
    padding: 24px;
  }
  .phone {
    width: 390px;
    height: 780px;
    flex-shrink: 0;
    background: #f4efdf;
    padding: 28px 20px;
    border-radius: 30px;
  }
  .bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 {
    font-size: 26px;
  }
  h2 {
    font-size: 22px;
    margin: 40px 0 14px;
  }
  p {
    color: #65705b;
    line-height: 1.8;
  }
  .card,
  button {
    background: #fffdf4;
    border: 0;
    border-radius: 16px;
    padding: 18px;
    margin: 12px 0;
    width: 100%;
    font: inherit;
    text-align: left;
    color: inherit;
  }
  button {
    min-height: 52px;
  }
  .main {
    background: #456449;
    color: white;
  }
  .tag {
    font-size: 13px;
    color: #65705b;
  }
  .seat {
    display: flex;
    justify-content: space-between;
  }
  .board {
    height: 430px;
    background: #cce9cf;
    border-radius: 18px;
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    padding: 40px 12px;
  }
  .node {
    height: 30px;
    border-radius: 50%;
    background: #fff9e8;
    text-align: center;
  }
  .blue {
    background: #85b9db;
  }
  .orange {
    background: #ffb85c;
  }
  .back {
    width: auto;
    padding: 14px;
    margin: 0;
  }
  .foot {
    margin-top: 40px;
    font-size: 13px;
  }
  .selected {
    border: 2px solid #456449;
  }
</style>
<section class="phone">
  <div class="bar">
    <h1>好友联机</h1>
    <button class="back">返回</button>
  </div>
  <p>围捕小队 · 和朋友玩一局</p>
  <h2>一起出发</h2>
  <button class="selected">玩法　出口竞速　 ›</button><button class="main">创建双人房间</button>
  <p>已收到好友的房间号？</p>
  <button>点此输入房间号</button><button>加入房间</button>
  <p class="foot">休闲对局，不计排行榜<br />离开或切到后台会结束本局</p>
</section>
<section class="phone">
  <div class="bar">
    <h1>等待朋友</h1>
    <button class="back">离开</button>
  </div>
  <p>房间号</p>
  <div class="card">Tap-room-example<button>复制房间号</button></div>
  <p>出口竞速 · 随机地图</p>
  <div class="card seat"><span>我 · 追逐队</span><b>已准备</b></div>
  <div class="card seat"><span>好友 · 突围队</span><span>准备中</span></div>
  <button class="main">准备</button>
  <p class="foot">双方准备好后开始<br />席位与地图本局固定</p>
</section>
<section class="phone">
  <div class="bar">
    <h1>围捕小队</h1>
    <button class="back">离开</button>
  </div>
  <p>我是追逐队 · 轮到我行动</p>
  <div class="board">
    <i class="node">1</i><i class="node blue">2</i><i class="node">3</i><i class="node">4</i
    ><i class="node">5</i><i class="node">6</i><i class="node">7</i><i class="node">8</i
    ><i class="node orange">9</i><i class="node">10</i><i class="node">11</i><i class="node">12</i
    ><i class="node">13</i><i class="node">14</i><i class="node blue">15</i>
  </div>
  <p>点队员，再点相邻路口</p>
  <button class="main">留守一步</button>
  <p class="tag">实际对局复用各游戏的现有渲染器</p>
</section>
