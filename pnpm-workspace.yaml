packages:
  - apps/*
  - packages/*
  - platforms/*
  - services/*
  - tools/*
  - games/local/*
  - games/submodules/*

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.5'
  - '@turbo/darwin-arm64@2.11.5'
  - '@turbo/linux-64@2.11.5'
  - '@turbo/linux-arm64@2.11.5'
  - '@turbo/windows-64@2.11.5'
  - '@turbo/windows-arm64@2.11.5'
  - turbo@2.11.5

# Keep fixed submodule and transitive Vite consumers on their patched release lines.
overrides:
  'vite@8.2.2': 8.2.4
  'vite@8.3.0': 8.3.3
  'vite@8.0.13': 8.1.6
  'vite@7.3.6': 7.3.7
  'vite@7.1.5': 7.3.7
  'vite@6.4.1': 6.4.4
  'vite@6.3.6': 6.4.4
  'vite@6.3.5': 6.4.4
