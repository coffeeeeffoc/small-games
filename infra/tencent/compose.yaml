name: small-games
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform_owner
      POSTGRES_DB: small_games
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform_owner -d small_games']
      interval: 5s
      timeout: 3s
      retries: 24
    logging: *logging
  runtime:
    image: small-games-backend:${RELEASE_ID:?required}
    build: .
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: '43002'
      TRUST_PROXY: '1'
      RUNTIME_DATABASE_URL: postgres://runtime_app:${RUNTIME_DB_PASSWORD:?required}@postgres:5432/small_games
      COMPETITION_ENABLED: 'true'
      COMPETITION_ORIGINS: https://${GAME_DOMAIN:?required}
      COMPETITION_INTERNAL_KEY: ${COMPETITION_INTERNAL_KEY:?required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:43002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 24
    logging: *logging
  kart:
    image: small-games-backend:${RELEASE_ID:?required}
    # Settlement endpoints deliberately accept loopback only. Share Runtime's network namespace.
    network_mode: service:runtime
    command: ['node', 'services/kart-server/src/main.ts']
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      TRUST_PROXY: '1'
      KART_SERVER_PORT: '43003'
      KART_ALLOWED_ORIGINS: https://${GAME_DOMAIN:?required}
      KART_OUTBOX_DIR: /app/outbox
      COMPETITION_API_URL: http://127.0.0.1:43002/api/competition/v1
      COMPETITION_INTERNAL_KEY: ${COMPETITION_INTERNAL_KEY:?required}
    volumes:
      - kart-outbox:/app/outbox
    depends_on:
      runtime:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:43003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 24
    logging: *logging
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ${ECS_TLS_DIR:?required}:/etc/nginx/certs:ro
      - ${ECS_DEPLOY_DIR:?required}/nginx-extra:/etc/nginx/extra:ro
      - ${ECS_DEPLOY_DIR:?required}/www:/var/www:ro
    depends_on:
      runtime:
        condition: service_healthy
      kart:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
volumes:
  postgres-data:
  kart-outbox:
