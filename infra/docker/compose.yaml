name: small-games-platform
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: small_games
      POSTGRES_USER: platform_owner
      POSTGRES_PASSWORD: local-owner-only
    ports: ['127.0.0.1:15432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations/001-local-ownership.sql:/docker-entrypoint-initdb.d/001-local-ownership.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform_owner -d small_games']
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: local-management
      MINIO_ROOT_PASSWORD: local-management-only
    ports: ['127.0.0.1:59000:9000', '127.0.0.1:59001:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/ready']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  minio-data:
