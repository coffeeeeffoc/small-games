<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152833"><meta name="description" content="拖动事件卡，还原深夜小店里镜头没拍到的几秒。三个可以亲手重演的喜剧谜案。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='18' fill='%23152833'/%3E%3Ccircle cx='40' cy='40' r='24' fill='%23edca73'/%3E%3Ccircle cx='40' cy='40' r='12' fill='%23152833'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css"><title>镜头外发生了什么 · 深夜小店</title>
</head>
<body>
<div class="shell">
<header class="masthead"><div><div class="eyebrow"><span class="live-dot"></span>深夜小店 / 监控档案</div><h1>镜头外<span>发生了什么</span><span class="title-dot">？</span></h1><p class="tagline">人来人往，总有几秒没拍到。</p></div><button id="mute" class="quiet" aria-label="静音" aria-pressed="false">♪ 声音开</button></header>
<nav id="cases" aria-label="选择小案"></nav>
<main class="game">
<section class="watch-panel" aria-label="观察证据">
<div class="case-heading"><div><span id="case-number" class="case-number"></span><h2 id="case-title"></h2></div><span class="camera-id">CAM 01 <span class="live-dot"></span></span></div>
<p id="subtitle" class="subtitle"></p>
<div class="monitor">
<div class="monitor-bar"><div class="tabs" aria-label="画面来源"><button data-mode="before">之前</button><button data-mode="after" class="active">之后</button><button data-mode="replay">我的重演</button></div><button id="zoom" aria-label="放大证据">⛶</button></div>
<div id="source-label" class="source-label"></div>
<div id="stage" class="stage"></div>
<div class="monitor-foot"><span id="frame-caption">观察前后变化</span><span id="timecode"></span></div>
<div id="play-progress"><i></i></div>
</div>
<div class="evidence-note"><span>观察提示</span><p id="rule"></p></div>
</section>
<section class="edit-panel" aria-label="还原事件">
<div class="editor-heading"><span class="section-index">02</span><div><h2>补上镜头外的几秒</h2><p>点卡放入 · 拖动换序 · 放齐自动重演</p></div></div>
<div class="timeline-label"><span>事情发生的顺序</span><button id="reset" class="text-button">重新排</button></div>
<div id="controls"><div id="slots" class="slots"></div><div class="bank-label">可能发生的动作 <span>每张一次</span></div><div id="bank" class="bank"></div></div>
<div id="feedback" class="feedback" role="status" aria-live="polite"><span class="status-icon">?</span><div><strong>椅子不见了，发生了什么？</strong><p>先看看画面，再把动作放进时间槽。</p></div></div>
<button id="confirm" class="confirm" disabled>放齐动作，自动重演</button>
<div class="secondary-actions"><button id="replay" class="text-button" disabled>↻ 再看重演</button><span id="progress-text">三件小案 · 约 3 分钟</span></div>
</section>
</main>
<footer><span>OFF CAMERA</span>一间小店，三场意外。<span class="footer-right">不计时 · 放心试错</span></footer>
</div>
<dialog id="zoom-dialog"><div class="dialog-head"><strong id="zoom-title">放大证据</strong></div><div id="zoom-scene"></div><p>物体的位置、遮挡与痕迹，都是线索。</p><button id="close-zoom">返回调查</button></dialog>
<script type="module" src="./game.mjs"></script>
</body></html>
