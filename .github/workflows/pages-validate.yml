name: Validate GitHub Pages artifacts

on:
  workflow_call:
    inputs:
      cocos:
        description: Whether this scope has a same-SHA CI Creator producer to reuse.
        required: true
        type: boolean
      browser:
        description: Run actual browser checks when the shared risk plan requires them.
        required: true
        type: boolean
      full:
        description: Run the full game regression suite.
        required: true
        type: boolean
      game_ids:
        description: JSON array of affected standalone game IDs.
        required: true
        type: string
      game_sources:
        description: JSON array of affected game source directories.
        required: true
        type: string

permissions:
  contents: read

jobs:
  kart:
    uses: ./.github/workflows/carding-car.yml
    with:
      reuse_ci: ${{ github.event_name == 'push' && inputs.cocos }}
    permissions:
      contents: read
      actions: read

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Balance browser regression shards
        id: shards
        env:
          PAGES_FULL_REGRESSION: ${{ inputs.full }}
          PAGES_GAME_IDS: ${{ inputs.game_ids }}
        run: node scripts/pages-regression-shards.mjs

  build:
    needs: kart
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KART_PREBUILT_DIR: ${{ github.workspace }}/games/local/carding-car/.prebuilt
      NIGHT_OVERWATCH_PREBUILT_DIR: ${{ github.workspace }}/games/local/night-overwatch/.prebuilt
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/${{ (github.base_ref || github.ref_name) == 'dev' && 'dev/' || (github.base_ref || github.ref_name) == 'test' && 'test/' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Restore Turborepo cache
        id: turbo
        uses: actions/cache/restore@v5
        with:
          path: |
            .turbo/cache/*.tar.zst
            .turbo/cache/*-meta.json
            .turbo/cache/*-manifest.json
          key: turbo-bounded-v1-pages-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-bounded-v1-pages-${{ runner.os }}-${{ github.job }}-
            turbo-bounded-v1-pages-${{ runner.os }}-
            turbo-bounded-v1-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: carding-car-${{ github.sha }}
          path: games/local/carding-car/.prebuilt
      - uses: actions/download-artifact@v8
        with:
          name: night-overwatch-${{ github.sha }}
          path: games/local/night-overwatch/.prebuilt
      - run: pnpm check:games
      - run: pnpm build:pages
      - run: pnpm check:games --artifacts
      - run: pnpm --filter @coffeeeeffoc/shell-web test:pages:artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: pages-build
          path: apps/shell-web/dist
          include-hidden-files: true
          if-no-files-found: error
      - name: Bound local Turborepo task cache
        run: node scripts/prune-turbo-cache.mjs
      - name: Save bounded Turborepo cache
        if: steps.turbo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .turbo/cache/*.tar.zst
            .turbo/cache/*-meta.json
            .turbo/cache/*-manifest.json
          key: ${{ steps.turbo.outputs.cache-primary-key }}

  logic:
    needs: kart
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KART_PREBUILT_DIR: ${{ github.workspace }}/games/local/carding-car/.prebuilt
      NIGHT_OVERWATCH_PREBUILT_DIR: ${{ github.workspace }}/games/local/night-overwatch/.prebuilt
      PAGES_FULL_REGRESSION: ${{ inputs.full }}
      PAGES_GAME_SOURCES: ${{ inputs.game_sources }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Restore Turborepo cache
        id: turbo
        uses: actions/cache/restore@v5
        with:
          path: |
            .turbo/cache/*.tar.zst
            .turbo/cache/*-meta.json
            .turbo/cache/*-manifest.json
          key: turbo-bounded-v1-pages-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-bounded-v1-pages-${{ runner.os }}-${{ github.job }}-
            turbo-bounded-v1-pages-${{ runner.os }}-
            turbo-bounded-v1-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: carding-car-${{ github.sha }}
          path: games/local/carding-car/.prebuilt
      - uses: actions/download-artifact@v8
        with:
          name: night-overwatch-${{ github.sha }}
          path: games/local/night-overwatch/.prebuilt
      - run: pnpm check:games
      - run: pnpm test:game-config
      - run: node --test scripts/pages-test-scope.test.mjs apps/shell-web/scripts/pages-validation.test.mjs
      - name: Test CI optimization gates
        run: node --test scripts/pages-regression-shards.test.mjs scripts/reuse-cocos-artifacts.test.mjs scripts/prune-turbo-cache.test.mjs
      - run: python3 scripts/test-pages-deploy.py
      - run: python3 scripts/test-mobile-assets.py
      - name: Test Shell with workspace dependencies
        run: pnpm exec turbo run test --filter=@coffeeeeffoc/shell-web --concurrency=1
      - run: node scripts/run-pages-game-tests.mjs
      - name: Bound local Turborepo task cache
        run: node scripts/prune-turbo-cache.mjs
      - name: Save bounded Turborepo cache
        if: steps.turbo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .turbo/cache/*.tar.zst
            .turbo/cache/*-meta.json
            .turbo/cache/*-manifest.json
          key: ${{ steps.turbo.outputs.cache-primary-key }}

  smoke:
    if: inputs.browser
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/${{ (github.base_ref || github.ref_name) == 'dev' && 'dev/' || (github.base_ref || github.ref_name) == 'test' && 'test/' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: pages-build
          path: apps/shell-web/dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:pages:smoke
      - name: Upload Pages host diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-host-smoke-${{ github.run_attempt }}
          path: .scratch/pages-host
          if-no-files-found: ignore

  regression:
    name: regression (shard ${{ matrix.shard }})
    needs: [build, plan]
    if: inputs.full || inputs.game_ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/${{ (github.base_ref || github.ref_name) == 'dev' && 'dev/' || (github.base_ref || github.ref_name) == 'test' && 'test/' || '' }}
      PAGES_GAME_IDS: ${{ matrix.game_ids }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: pages-build
          path: apps/shell-web/dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:pages:games
      - name: Upload browser regression diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-game-regression-${{ github.run_attempt }}-${{ matrix.shard }}
          path: .scratch/game-integration
          if-no-files-found: ignore
