name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kart:
    uses: ./.github/workflows/carding-car.yml
  quality:
    needs: kart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KART_PREBUILT_DIR: ${{ github.workspace }}/games/local/carding-car/.prebuilt
      NIGHT_OVERWATCH_PREBUILT_DIR: ${{ github.workspace }}/games/local/night-overwatch/.prebuilt
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: carding-car-${{ github.sha }}
          path: games/local/carding-car/.prebuilt
      - uses: actions/download-artifact@v8
        with:
          name: night-overwatch-${{ github.sha }}
          path: games/local/night-overwatch/.prebuilt

      - name: Check all game registrations
        run: pnpm check:games

      - name: Test game registration checker
        run: pnpm test:game-config

      - name: Check formatting
        run: pnpm format:check

      - name: Lint platform packages
        run: pnpm lint:affected

      - name: Typecheck affected packages
        run: pnpm typecheck:affected

      - name: Check package boundaries and cycles
        run: pnpm check:dependencies

      - name: Test dependency checker
        run: pnpm test:boundaries

      - name: Install browser for smoke tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Test affected packages
        run: pnpm test:affected

      - name: Run affected contract tests
        run: pnpm test:contract:affected

      - name: Run affected integration tests
        run: pnpm test:integration:affected

      - name: Build affected packages
        run: pnpm build:affected

      - name: Smoke-test affected applications
        run: pnpm smoke:affected
