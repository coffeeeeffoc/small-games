name: Build Cocos game artifacts
on:
  workflow_call:
    inputs:
      competition_public_api_url:
        description: Public API URL used to fingerprint and build Tower Brake artifacts.
        type: string
        default: ''
      reuse_ci:
        description: Reuse successful same-SHA CI Creator jobs on push events.
        type: boolean
        default: false
jobs:
  reuse:
    if: inputs.reuse_ci
    env:
      COMPETITION_PUBLIC_API_URL: ${{ inputs.competition_public_api_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      available: ${{ steps.verify.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Wait for successful CI Creator gates
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reuse-cocos-artifacts.mjs discover
      - name: Download CI carding-car artifact
        id: kart
        if: steps.producer.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: carding-car-${{ github.sha }}
          path: .scratch/ci-cocos/carding-car
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download CI night-overwatch artifact
        id: night
        if: steps.producer.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: night-overwatch-${{ github.sha }}
          path: .scratch/ci-cocos/night-overwatch
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download CI orbit-atelier artifact
        id: orbit
        if: steps.producer.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: orbit-atelier-${{ github.sha }}
          path: .scratch/ci-cocos/orbit-atelier
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download CI bullet-garden artifact
        id: garden
        if: steps.producer.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: bullet-garden-${{ github.sha }}
          path: .scratch/ci-cocos/bullet-garden
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download CI tianxia-chalu artifact
        id: tianxia
        if: steps.producer.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: tianxia-chalu-${{ github.sha }}
          path: .scratch/ci-cocos/tianxia-chalu
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download CI homebound-station artifact
        id: homebound
        if: steps.producer.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: homebound-station-${{ github.sha }}
          path: .scratch/ci-cocos/homebound-station
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download CI merge-front artifact
        id: merge
        if: steps.producer.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: merge-front-${{ github.sha }}
          path: .scratch/ci-cocos/merge-front
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download CI tower-brake artifact
        id: tower
        if: steps.producer.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: tower-brake-${{ github.sha }}
          path: .scratch/ci-cocos/tower-brake
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download CI tetracube artifact
        id: tetra
        if: steps.producer.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: tetracube-${{ github.sha }}
          path: .scratch/ci-cocos/tetracube
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download CI three-choose-two artifact
        id: three
        if: steps.producer.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: three-choose-two-${{ github.sha }}
          path: .scratch/ci-cocos/three-choose-two
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download CI game-castle-cannon artifact
        id: castle
        if: steps.producer.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: game-castle-cannon-${{ github.sha }}
          path: .scratch/ci-cocos/game-castle-cannon
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify all downloaded artifacts or rebuild
        id: verify
        if: steps.kart.outcome == 'success' && steps.night.outcome == 'success' && steps.orbit.outcome == 'success' && steps.tianxia.outcome == 'success' && steps.homebound.outcome == 'success' && steps.merge.outcome == 'success' && steps.garden.outcome == 'success' && steps.tower.outcome == 'success' && steps.tetra.outcome == 'success' && steps.three.outcome == 'success' && steps.castle.outcome == 'success'
        continue-on-error: true
        env:
          PRODUCER_RUN_ID: ${{ steps.producer.outputs.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.run_attempt }}
        run: |
          node scripts/reuse-cocos-artifacts.mjs verify carding-car .scratch/ci-cocos/carding-car
          node scripts/reuse-cocos-artifacts.mjs verify night-overwatch .scratch/ci-cocos/night-overwatch
          node scripts/reuse-cocos-artifacts.mjs verify orbit-atelier .scratch/ci-cocos/orbit-atelier
          node scripts/reuse-cocos-artifacts.mjs verify bullet-garden .scratch/ci-cocos/bullet-garden
          node scripts/reuse-cocos-artifacts.mjs verify tianxia-chalu .scratch/ci-cocos/tianxia-chalu
          node scripts/reuse-cocos-artifacts.mjs verify homebound-station .scratch/ci-cocos/homebound-station
          node scripts/reuse-cocos-artifacts.mjs verify merge-front .scratch/ci-cocos/merge-front
          node scripts/reuse-cocos-artifacts.mjs verify tower-brake .scratch/ci-cocos/tower-brake
          node scripts/reuse-cocos-artifacts.mjs verify tetracube .scratch/ci-cocos/tetracube
          node scripts/reuse-cocos-artifacts.mjs verify three-choose-two .scratch/ci-cocos/three-choose-two
          node scripts/reuse-cocos-artifacts.mjs verify game-castle-cannon .scratch/ci-cocos/game-castle-cannon
      - uses: actions/upload-artifact@v7
        if: steps.verify.outcome == 'success'
        with:
          name: carding-car-${{ github.sha }}
          path: .scratch/ci-cocos/carding-car
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: steps.verify.outcome == 'success'
        with:
          name: night-overwatch-${{ github.sha }}
          path: .scratch/ci-cocos/night-overwatch
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: steps.verify.outcome == 'success'
        with:
          name: orbit-atelier-${{ github.sha }}
          path: .scratch/ci-cocos/orbit-atelier
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: steps.verify.outcome == 'success'
        with:
          name: bullet-garden-${{ github.sha }}
          path: .scratch/ci-cocos/bullet-garden
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: steps.verify.outcome == 'success'
        with:
          name: tianxia-chalu-${{ github.sha }}
          path: .scratch/ci-cocos/tianxia-chalu
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: steps.verify.outcome == 'success'
        with:
          name: homebound-station-${{ github.sha }}
          path: .scratch/ci-cocos/homebound-station
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: steps.verify.outcome == 'success'
        with:
          name: merge-front-${{ github.sha }}
          path: .scratch/ci-cocos/merge-front
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: steps.verify.outcome == 'success'
        with:
          name: tower-brake-${{ github.sha }}
          path: .scratch/ci-cocos/tower-brake
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: steps.verify.outcome == 'success'
        with:
          name: tetracube-${{ github.sha }}
          path: .scratch/ci-cocos/tetracube
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: steps.verify.outcome == 'success'
        with:
          name: three-choose-two-${{ github.sha }}
          path: .scratch/ci-cocos/three-choose-two
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: steps.verify.outcome == 'success'
        with:
          name: game-castle-cannon-${{ github.sha }}
          path: .scratch/ci-cocos/game-castle-cannon
          if-no-files-found: error
  creator:
    needs: reuse
    if: always() && !cancelled() && (needs.reuse.result == 'skipped' || (needs.reuse.result == 'success' && needs.reuse.outputs.available != 'true'))
    strategy:
      fail-fast: false
      matrix:
        game:
          [
            carding-car,
            night-overwatch,
            orbit-atelier,
            tianxia-chalu,
            homebound-station,
            merge-front,
            bullet-garden,
            tower-brake,
            tetracube,
            three-choose-two,
            game-castle-cannon,
          ]
    runs-on: windows-latest
    env:
      COMPETITION_PUBLIC_API_URL: ${{ matrix.game == 'tower-brake' && inputs.competition_public_api_url || '' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Hash game sources and runtime art
        id: source
        run: |
          $hash = node --input-type=module -e "import { sourceHash } from './games/local/${{ matrix.game }}/scripts/artifact.mjs'; console.log(await sourceHash());"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "engine-cache=$([System.IO.Path]::GetTempPath())CocosCreator/3.8.8/builder/engine" >> $env:GITHUB_OUTPUT
      - name: Restore matching game artifact
        id: artifact
        uses: actions/cache/restore@v5
        with:
          path: |
            games/local/${{ matrix.game }}/dist
            games/local/${{ matrix.game }}/cc.d.ts
          key: ${{ matrix.game == 'carding-car' && 'kart' || matrix.game }}-web-v1-${{ runner.os }}-${{ steps.source.outputs.hash }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:games
      - uses: actions/cache@v5
        if: steps.artifact.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/cocos/3.8.8
          key: cocos-creator-3.8.8-win-121518
      - name: Restore Creator import and engine caches
        if: steps.artifact.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            games/local/${{ matrix.game }}/library
            games/local/${{ matrix.game }}/temp/asset-db
            games/local/${{ matrix.game }}/temp/programming
            ${{ steps.source.outputs.engine-cache }}
          key: ${{ matrix.game == 'carding-car' && 'kart' || matrix.game }}-import-3.8.8-v1-${{ runner.os }}-${{ steps.source.outputs.hash }}
          restore-keys: |
            ${{ matrix.game == 'carding-car' && 'kart' || matrix.game }}-import-3.8.8-v1-${{ runner.os }}-
      - run: pnpm --filter @coffeeeeffoc/carding-car run setup
        if: steps.artifact.outputs.cache-hit != 'true'
      - run: pnpm --dir games/local/${{ matrix.game }} run typecheck
        env:
          KART_PREBUILT_DIR: ${{ steps.artifact.outputs.cache-hit == 'true' && format('{0}/games/local/carding-car', github.workspace) || '' }}
          NIGHT_OVERWATCH_PREBUILT_DIR: ${{ steps.artifact.outputs.cache-hit == 'true' && format('{0}/games/local/night-overwatch', github.workspace) || '' }}
          ORBIT_ATELIER_PREBUILT_DIR: ${{ steps.artifact.outputs.cache-hit == 'true' && format('{0}/games/local/orbit-atelier', github.workspace) || '' }}
          BULLET_GARDEN_PREBUILT_DIR: ${{ steps.artifact.outputs.cache-hit == 'true' && format('{0}/games/local/bullet-garden', github.workspace) || '' }}
          TIANXIA_PREBUILT_DIR: ${{ steps.artifact.outputs.cache-hit == 'true' && format('{0}/games/local/tianxia-chalu', github.workspace) || '' }}
          HOMEBOUND_STATION_PREBUILT_DIR: ${{ steps.artifact.outputs.cache-hit == 'true' && format('{0}/games/local/homebound-station', github.workspace) || '' }}
          MERGE_FRONT_PREBUILT_DIR: ${{ steps.artifact.outputs.cache-hit == 'true' && format('{0}/games/local/merge-front', github.workspace) || '' }}
          TOWER_BRAKE_PREBUILT_DIR: ${{ steps.artifact.outputs.cache-hit == 'true' && format('{0}/games/local/tower-brake', github.workspace) || '' }}
          TETRACUBE_PREBUILT_DIR: ${{ steps.artifact.outputs.cache-hit == 'true' && format('{0}/games/local/tetracube', github.workspace) || '' }}
          THREE_CHOOSE_TWO_PREBUILT_DIR: ${{ steps.artifact.outputs.cache-hit == 'true' && format('{0}/games/local/three-choose-two', github.workspace) || '' }}
          CASTLE_CANNON_PREBUILT_DIR: ${{ steps.artifact.outputs.cache-hit == 'true' && format('{0}/games/local/game-castle-cannon', github.workspace) || '' }}
      - run: pnpm --dir games/local/${{ matrix.game }} run test
      - run: pnpm --dir games/local/${{ matrix.game }} run build
        if: steps.artifact.outputs.cache-hit != 'true'
        timeout-minutes: 18
      - name: Include engine types for Linux and macOS checks
        if: steps.artifact.outputs.cache-hit != 'true'
        run: Copy-Item -LiteralPath "$env:USERPROFILE/.cache/cocos/3.8.8/resources/resources/3d/engine/bin/.declarations/cc.d.ts" -Destination games/local/${{ matrix.game }}/cc.d.ts
      - name: Verify artifact matches current sources
        run: node --input-type=module -e "import { verifyPrebuilt } from './games/local/${{ matrix.game }}/scripts/artifact.mjs'; await verifyPrebuilt('games/local/${{ matrix.game }}');"
      - name: Save verified game artifact
        if: steps.artifact.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            games/local/${{ matrix.game }}/dist
            games/local/${{ matrix.game }}/cc.d.ts
          key: ${{ steps.artifact.outputs.cache-primary-key }}
      - name: Stamp verified producer provenance
        run: node scripts/reuse-cocos-artifacts.mjs stamp ${{ matrix.game }} games/local/${{ matrix.game }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.game }}-${{ github.sha }}
          path: |
            games/local/${{ matrix.game }}/dist
            games/local/${{ matrix.game }}/cc.d.ts
            games/local/${{ matrix.game }}/cocos-provenance.json
          if-no-files-found: error
      - name: Upload Creator build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.game }}-logs-${{ github.run_attempt }}
          path: |
            games/local/${{ matrix.game }}/reports/build-*.log
            games/local/${{ matrix.game }}/temp/logs
            games/local/${{ matrix.game }}/temp/builder/log
          if-no-files-found: ignore
