name: Build Cocos game artifacts
on:
  workflow_call:
jobs:
  creator:
    strategy:
      fail-fast: false
      matrix:
        game: [carding-car, night-overwatch]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Hash game sources and runtime art
        id: source
        run: |
          $hash = node --input-type=module -e "import { sourceHash } from './games/local/${{ matrix.game }}/scripts/artifact.mjs'; console.log(await sourceHash());"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "engine-cache=$([System.IO.Path]::GetTempPath())CocosCreator/3.8.8/builder/engine" >> $env:GITHUB_OUTPUT
      - name: Restore matching game artifact
        id: artifact
        uses: actions/cache/restore@v5
        with:
          path: |
            games/local/${{ matrix.game }}/dist
            games/local/${{ matrix.game }}/cc.d.ts
          key: ${{ matrix.game == 'carding-car' && 'kart' || matrix.game }}-web-v1-${{ runner.os }}-${{ steps.source.outputs.hash }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:games
      - uses: actions/cache@v5
        if: steps.artifact.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/cocos/3.8.8
          key: cocos-creator-3.8.8-win-121518
      - name: Restore Creator import and engine caches
        if: steps.artifact.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            games/local/${{ matrix.game }}/library
            games/local/${{ matrix.game }}/temp/asset-db
            games/local/${{ matrix.game }}/temp/programming
            ${{ steps.source.outputs.engine-cache }}
          key: ${{ matrix.game == 'carding-car' && 'kart' || matrix.game }}-import-3.8.8-v1-${{ runner.os }}-${{ steps.source.outputs.hash }}
          restore-keys: |
            ${{ matrix.game == 'carding-car' && 'kart' || matrix.game }}-import-3.8.8-v1-${{ runner.os }}-
      - run: pnpm --filter @coffeeeeffoc/carding-car run setup
        if: steps.artifact.outputs.cache-hit != 'true'
      - run: pnpm --filter @coffeeeeffoc/${{ matrix.game }} typecheck
        env:
          KART_PREBUILT_DIR: ${{ steps.artifact.outputs.cache-hit == 'true' && format('{0}/games/local/carding-car', github.workspace) || '' }}
          NIGHT_OVERWATCH_PREBUILT_DIR: ${{ steps.artifact.outputs.cache-hit == 'true' && format('{0}/games/local/night-overwatch', github.workspace) || '' }}
      - run: pnpm --filter @coffeeeeffoc/${{ matrix.game }} test
      - run: pnpm --filter @coffeeeeffoc/${{ matrix.game }} build
        if: steps.artifact.outputs.cache-hit != 'true'
        timeout-minutes: 18
      - name: Include engine types for Linux and macOS checks
        if: steps.artifact.outputs.cache-hit != 'true'
        run: Copy-Item -LiteralPath "$env:USERPROFILE/.cache/cocos/3.8.8/resources/resources/3d/engine/bin/.declarations/cc.d.ts" -Destination games/local/${{ matrix.game }}/cc.d.ts
      - name: Verify artifact matches current sources
        run: node --input-type=module -e "import { verifyPrebuilt } from './games/local/${{ matrix.game }}/scripts/artifact.mjs'; await verifyPrebuilt('games/local/${{ matrix.game }}');"
      - name: Save verified game artifact
        if: steps.artifact.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            games/local/${{ matrix.game }}/dist
            games/local/${{ matrix.game }}/cc.d.ts
          key: ${{ steps.artifact.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.game }}-${{ github.sha }}
          path: |
            games/local/${{ matrix.game }}/dist
            games/local/${{ matrix.game }}/cc.d.ts
          if-no-files-found: error
      - name: Upload Creator build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.game }}-logs-${{ github.run_attempt }}
          path: |
            games/local/${{ matrix.game }}/reports/build-*.log
            games/local/${{ matrix.game }}/temp/logs
            games/local/${{ matrix.game }}/temp/builder/log
          if-no-files-found: ignore
