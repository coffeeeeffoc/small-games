name: Deploy arcade to GitHub Pages

on:
  push:
    branches: [main, dev, test]
  pull_request:
  workflow_dispatch:
  schedule:
    # Full regression daily at 02:00 Asia/Shanghai; scheduled runs never publish.
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
      full: ${{ steps.scope.outputs.full }}
      game_ids: ${{ steps.scope.outputs.game_ids }}
      game_sources: ${{ steps.scope.outputs.game_sources }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Test Pages validation selection
        run: node --test scripts/pages-test-scope.test.mjs apps/shell-web/scripts/pages-validation.test.mjs
      - name: Select Pages validation scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PAGES_DIFF_HEAD: ${{ github.sha }}
        run: node scripts/pages-test-scope.mjs

  validate:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    uses: ./.github/workflows/pages-validate.yml
    with:
      full: ${{ needs.changes.outputs.full == 'true' }}
      game_ids: ${{ needs.changes.outputs.game_ids }}
      game_sources: ${{ needs.changes.outputs.game_sources }}
    concurrency:
      # Nightly checks must not cancel validation needed by a branch publication.
      group: pages-validation-${{ github.event_name == 'schedule' && 'scheduled' || 'branch' }}-${{ github.ref }}
      cancel-in-progress: true

  # Keep the existing required "build" check, including successful documentation-only runs.
  build:
    needs: [changes, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected validation gate
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          VALIDATION_REQUIRED: ${{ needs.changes.outputs.required }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SCOPE_RESULT" != success ]; then
            echo "Pages scope detection did not succeed: $SCOPE_RESULT"
            exit 1
          fi
          case "$VALIDATION_REQUIRED" in
            true)
              if [ "$VALIDATION_RESULT" != success ]; then
                echo "Pages validation did not succeed: $VALIDATION_RESULT"
                exit 1
              fi
              echo "Every selected Pages validation gate passed."
              ;;
            false)
              echo "This change does not affect Pages; validation is unnecessary."
              ;;
            *)
              echo "Pages scope detection returned an invalid validation requirement."
              exit 1
              ;;
          esac

  deploy:
    if: >-
      needs.changes.result == 'success' && needs.build.result == 'success' &&
      needs.changes.outputs.required == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      contains(fromJSON('["refs/heads/main", "refs/heads/dev", "refs/heads/test"]'), github.ref)
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # Verification can be cancelled; saving environment state and publishing must finish together.
      group: pages-publish
      queue: max
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ github.ref_name != 'main' && format('{0}/', github.ref_name) || '' }}
    env:
      STATE_DIR: ${{ github.workspace }}/.scratch/pages-state
      BUILD_DIR: ${{ github.workspace }}/.scratch/pages-build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: pages-build
          path: ${{ env.BUILD_DIR }}
      - name: Restore all published environments
        shell: bash
        run: |
          set -euo pipefail
          existing=$(git ls-remote --heads origin refs/heads/gh-pages)
          if [ -n "$existing" ]; then
            git fetch --no-tags --depth=1 origin gh-pages
            git worktree add --detach "$STATE_DIR" FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages "$STATE_DIR"
          fi
      - name: Update this environment and assemble the site
        run: python3 scripts/prepare-pages-deploy.py "$BUILD_DIR" "$STATE_DIR" .scratch/pages-site "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: site
        with:
          path: .scratch/pages-site
      - name: Save validated environment artifacts
        shell: bash
        run: |
          set -euo pipefail
          git -C "$STATE_DIR" config user.name 'github-actions[bot]'
          git -C "$STATE_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$STATE_DIR" add --all
          if ! git -C "$STATE_DIR" diff --cached --quiet; then
            git -C "$STATE_DIR" commit -m "Pages $GITHUB_REF_NAME at $GITHUB_SHA"
            git -C "$STATE_DIR" push origin HEAD:gh-pages
          fi
      - name: Deploy
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.site.outputs.artifact_id }}
        run: python3 scripts/publish-pages.py "$ARTIFACT_ID" "$(git -C "$STATE_DIR" rev-parse HEAD)" .scratch/pages-site
