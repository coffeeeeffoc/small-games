name: Build mobile apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: '1'
      APP_VERSION: '0.2.0'
      # Reserve the first 1000 codes for local builds; reruns retain the same application version.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 8.14.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: pnpm install --frozen-lockfile
      - run: chmod +x apps/shell-android/gradlew
      - run: pnpm --filter @coffeeeeffoc/shell-android test:updates
      - name: Configure version and stable release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            test -n "$ANDROID_KEYSTORE_PASSWORD"
            test -n "$ANDROID_KEY_ALIAS"
            test -n "$ANDROID_KEY_PASSWORD"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK and lint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            pnpm android:release
          else
            pnpm android:apk
          fi
          cd apps/shell-android
          ./gradlew --no-daemon :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/shell-android/dist/*.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      GOMAXPROCS: '1'
      APP_VERSION: '0.2.0'
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 8.14.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ios:simulator
      - run: python3 apps/shell-ios/scripts/test-install-manifest.py
      - name: Launch simulator build
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for key, devices in json.load(sys.stdin)["devices"].items() if "iOS" in key for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" apps/shell-ios/dist/SmallGames.app
          xcrun simctl launch "$DEVICE" com.coffeeeeffoc.smallgames
          sleep 10
          xcrun simctl io "$DEVICE" screenshot apps/shell-ios/dist/ios-catalog.png
      - name: Import optional distribution signing
        if: env.IOS_CERTIFICATE_BASE64 != '' && github.event_name != 'pull_request'
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_EXPORT_OPTIONS_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_BASE64 }}
        run: |
          test -n "$IOS_PROFILE_BASE64"
          test -n "$IOS_EXPORT_OPTIONS_BASE64"
          KEYCHAIN="$RUNNER_TEMP/ios-build.keychain-db"
          PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$PASSWORD"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$IOS_EXPORT_OPTIONS_BASE64" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "IOS_PROFILE_PATH=$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE" >> "$GITHUB_ENV"
          echo "IOS_TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          echo "IOS_EXPORT_OPTIONS=$RUNNER_TEMP/ExportOptions.plist" >> "$GITHUB_ENV"
      - name: Archive for devices; export IPA when signing is configured
        run: |
          if [ -n "$IOS_TEAM_ID" ]; then
            pnpm ios:archive --signed
            cp apps/shell-ios/dist/SmallGames.ipa apps/shell-ios/dist/moyu-arcade.ipa
            python3 apps/shell-ios/scripts/install-manifest.py apps/shell-ios/dist/moyu-arcade.ipa "$IOS_EXPORT_OPTIONS" "https://github.com/$GITHUB_REPOSITORY/releases/download/mobile-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT/moyu-arcade.ipa" apps/shell-ios/dist/ios-manifest.plist
          else
            pnpm ios:archive
          fi
          ditto -c -k --keepParent apps/shell-ios/dist/SmallGames.xcarchive apps/shell-ios/dist/SmallGames-archive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-builds
          path: |
            apps/shell-ios/dist/*.zip
            apps/shell-ios/dist/*.ipa
            apps/shell-ios/dist/ios-manifest.plist
            apps/shell-ios/dist/*.png
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ios-build.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/ios-build.keychain-db"; fi
          if [ -n "$IOS_PROFILE_PATH" ]; then rm -f "$IOS_PROFILE_PATH"; fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"

  release:
    needs: [android, ios]
    if: always() && needs.android.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk
      - uses: actions/download-artifact@v4
        if: needs.ios.result == 'success'
        with:
          name: ios-builds
          path: ios
      - name: Publish signed APK for the in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -f apk/moyu-arcade.apk ]; then
            echo 'Signing is not configured. Debug APK is available in Actions artifacts; no updatable release is published.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          HEAD=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo 'A newer commit is on main. Keep this APK as an artifact without replacing the latest release.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TAG="mobile-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          FILES=(apk/moyu-arcade.apk)
          if [ -f ios/moyu-arcade.ipa ]; then FILES+=(ios/moyu-arcade.ipa); fi
          if [ -f ios/ios-manifest.plist ]; then FILES+=(ios/ios-manifest.plist); fi
          gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" --title "测试版 $GITHUB_RUN_NUMBER" --notes "Android: download moyu-arcade.apk and install; updates require the same signing key. iOS: signed IPA is included only when Apple signing is configured; registered devices can use the in-app latest-version install button. Web test: https://coffeeeeffoc.github.io/small-games/ — Source: $GITHUB_SHA" --latest
