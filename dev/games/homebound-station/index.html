  #station-loading img{width:min(46vw,220px);height:auto}#station-loading h1{font-size:36px;margin:0;letter-spacing:6px}#station-loading p{margin:0;max-width:90%;line-height:1.6}#station-loading small{letter-spacing:3px;font-size:10px}#station-loading progress{width:min(65vw,280px);height:8px;accent-color:#225953}#loading-retry{min-height:48px;border:0;border-radius:24px;background:#225953;color:#fff4de;padding:10px 28px;font:inherit}

  </style><script src="./dev-mode.js"></script><script type="module" src="./station-share.js"></script><script src="./platform-config.js"></script></head>
<body><section id="station-loading" aria-label="归途站加载中" aria-busy="true"><img src="./station-icon.png" alt="归途站出租车图标"><h1>归途站</h1><small>HOMEBOUND STATION</small><progress aria-label="正在加载"></progress><p id="loading-status" role="status">正在打开车站…</p><button id="loading-retry" hidden>重新加载</button></section><script>(function runtime() {
  const panel = document.getElementById('station-loading'),
    status = document.getElementById('loading-status'),
    retry = document.getElementById('loading-retry');
  let engine,
    settled = false;
  const timer = setTimeout(fail, 60000);
  function clean() {
    clearTimeout(timer);
    window.removeEventListener('homebound-ready', ready);
    window.removeEventListener('homebound-load-error', fail);
  }
  function fail() {
    if (settled) return;
    settled = true;
    clean();
    engine?.game.pause();
    panel.setAttribute('aria-busy', 'false');
    status.textContent = '车站暂未打开，请检查网络后重试';
    panel.querySelector('progress').hidden = true;
    retry.hidden = false;
  }
  function ready() {
    status.textContent = '车站就绪，欢迎接班';
    engine.director.once(engine.Director.EVENT_AFTER_DRAW, () => {
      if (settled) return;
      settled = true;
      clean();
      panel.remove();
      document.getElementById('GameDiv')?.removeAttribute('inert');
    });
  }
  retry.onclick = () => location.reload();
  window.addEventListener('homebound-ready', ready);
  window.addEventListener('homebound-load-error', fail);
  window.HomeboundStartup = {
    async boot(applicationPath) {
      document.getElementById('GameDiv')?.setAttribute('inert', '');
      try {
        const { Application } = await System.import(applicationPath);
        engine = await System.import('cc');
        if (settled) return;
        engine.game.onPostBaseInitDelegate.add(() => {
          engine.settings.overrideSettings('splashScreen', 'totalTime', 0);
          engine.settings.overrideSettings('splashScreen', 'logo', { type: 'none' });
          engine.settings.overrideSettings('screen', 'exactFitScreen', true);
        });
        status.textContent = '正在布置车站、出租车与乘客…';
        const app = new Application();
        await app.init(engine);
        await app.start();
      } catch (error) {
        fail();
        console.error('[homebound-station startup]', error);
      }
    },
  };
})();
</script>
  <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
      </div>
    </div>
