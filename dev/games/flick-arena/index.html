<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#102b32" />
    <link rel="icon" href="data:," />
    <title>弹指擂台 · 闯关与好友切磋</title>
    <link rel="stylesheet" href="./style.css" />
  <script>globalThis.__COMPETITION_CONFIG__={"apiUrl":"https://api.nenggongzhiren.cn/small-games/v1"};</script></head>
  <body>
    <main id="stage" aria-label="弹指擂台">
      <div id="GameDiv">
        <div id="Cocos3dGameContainer">
          <canvas
            id="game"
            aria-label="弹指擂台：轮到你时按住自己的圆盘，向后拉，松手弹出"
          ></canvas>
        </div>
      </div>
      <div id="controls"></div>
      <div id="fields"></div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="./dev-mode.js"></script>
    <script type="module">
      import('./src/web.mjs').catch(() => {
        const status = document.querySelector('#status');
        status.className = 'load-error';
        status.textContent = '擂台加载失败，请重试';
        const retry = document.createElement('button');
        retry.textContent = '重新加载';
        retry.onclick = () => location.reload();
        status.append(retry);
      });
    </script>
  </body>
</html>
