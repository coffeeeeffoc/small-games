<!doctype html>
<html lang="zh-CN">
  <head>
  <script src="./dev-mode.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#101b21" />
    <meta
      name="description"
      content="Build a circuit for sound. Place mirrors, split a single pulse, and share delays to weave three precisely timed echoes."
    />
    <title>Echo Weaver · 回声编织</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101b21'/%3E%3Cpath d='M7 16h3l3-8 5 16 4-8h3' stroke='%2396e5c7' stroke-width='2' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="masthead">
        <a class="brand" href="./"
          ><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16h6l4-10 6 20 4-10h6" /></svg
          ><span
            >ECHO <b>WEAVER</b><small data-i18n="brandSub">回声编织 / 空间节拍实验</small></span
          ></a
        >
        <div class="header-actions">
          <button id="sound" class="icon-button" aria-label="开启音效"></button
          ><button id="language" class="text-button">EN</button
          ><button id="help" class="icon-button" aria-label="玩法说明">?</button>
        </div>
      </header>
      <main>
        <nav id="level-nav" aria-label="选择实验"></nav>
        <section class="lesson-heading">
          <div>
            <p id="level-subtitle" class="eyebrow"></p>
            <h1><span id="level-number">01</span><span id="level-title"></span></h1>
          </div>
          <p id="lesson"></p>
        </section>
        <div class="workspace">
          <section class="workbench">
            <div class="score-strip">
              <div class="score-heading">
                <span data-i18n="target">目标到达时刻</span><span id="clock">0.0</span>
              </div>
              <div id="rhythm"></div>
              <div class="score-caption">
                <span data-i18n="unit">每走一格 = ¼ 拍</span><span id="phase-label"></span>
              </div>
            </div>
            <div class="board-shell">
              <div class="board-corners">
                <span data-i18n="boardLabel">构建你的声路</span><span id="piece-count"></span>
              </div>
              <div id="board" role="group" aria-label="声路棋盘"></div>
              <div class="board-key">
                <span><i class="legend-mirror"></i><span data-i18n="mirror">反射板</span></span
                ><span><i class="legend-splitter"></i><span data-i18n="splitter">分声器</span></span
                ><span><i class="legend-delay"></i><span data-i18n="delay">延迟器</span></span>
              </div>
            </div>
            <div class="inventory-panel">
              <div class="inventory-heading">
                <span data-i18n="inventory">器件架 · 拖入棋盘</span
                ><span id="selection-hint"></span>
              </div>
              <div id="inventory" role="group" aria-label="可用器件"></div>
              <div class="edit-controls">
                <span id="selected-label"></span
                ><button id="rotate" class="small-button" data-i18n="rotate">旋转</button
                ><button id="return-piece" class="small-button" data-i18n="returnPiece">
                  收回器件
                </button>
              </div>
            </div>
            <div class="transport">
              <button id="emit" class="primary-button"></button
              ><button id="pause" class="icon-button" aria-label="暂停" hidden></button
              ><button id="undo" class="small-button" data-i18n="undo">撤销</button
              ><button id="restart" class="small-button" data-i18n="restart">重置</button
              ><button id="slow" class="small-button" aria-pressed="false">½×</button>
            </div>
          </section>
          <aside class="notebook">
            <section class="notes-card">
              <div class="section-heading">
                <h2 data-i18n="notes">实验记录</h2>
                <span id="attempts"></span>
              </div>
              <div id="trial-state"></div>
              <div id="arrival-log"></div>
              <button id="replay" class="secondary-button" data-i18n="replay">重放上次试奏</button>
            </section>
            <section class="idea-card">
              <p class="eyebrow">DISTANCE · ORDER · SHARED TIME</p>
              <h2 data-i18n="ideaTitle">一个机关，影响几次回声？</h2>
              <p data-i18n="ideaCopy">
                延迟器放在分声前，会让后面的回声一起晚到。放在支路，只影响其中一道。
              </p>
              <svg class="shared-diagram" viewBox="0 0 230 82" aria-hidden="true">
                <path d="M10 41h36m30 0h39m0 0 37-24h65M115 41l37 24h65" />
                <rect x="46" y="26" width="30" height="30" rx="6" />
                <text x="61" y="46">+2</text>
                <circle cx="115" cy="41" r="5" />
                <circle cx="215" cy="17" r="4" />
                <circle cx="215" cy="65" r="4" />
              </svg>
              <div class="hint-controls">
                <button id="hint" class="text-button" data-i18n="hint">给一点线索 ↗</button>
              </div>
              <p id="hint-copy" role="status" aria-live="polite"></p>
            </section>
            <section class="rules-card">
              <h2 data-i18n="rulesTitle">工作台规则</h2>
              <ul id="quick-rules"></ul>
              <div id="energy-rule"></div>
            </section>
          </aside>
        </div>
        <footer>
          <span id="completion"></span><span data-i18n="silent">不用麦克风 · 静音同样可玩</span>
        </footer>
      </main>
    </div>
    <div id="drag-ghost" hidden aria-hidden="true"></div>
    <dialog id="help-dialog" aria-labelledby="help-title">
      <p class="eyebrow">THE WEAVER'S FIELD NOTES</p>
      <h2 id="help-title" data-i18n="helpTitle">自己搭路，再让声音出发。</h2>
      <div id="help-content"></div>
      <button id="close-help" class="primary-button" data-i18n="closeHelp">回到工作台 →</button>
    </dialog>
    <dialog id="result" aria-labelledby="result-title">
      <p id="result-kicker" class="eyebrow"></p>
      <h2 id="result-title"></h2>
      <p id="result-copy"></p>
      <div id="result-arrivals"></div>
      <button id="continue" class="primary-button"></button
      ><button id="result-close" class="text-button" data-i18n="backBoard">留在棋盘查看轨迹</button>
    </dialog>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
