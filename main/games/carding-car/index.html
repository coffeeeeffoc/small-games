      </nav><script>(function displayControls() {
  const fullscreen = document.getElementById('kart-fullscreen');
  let controls = {}, locking = false;
  const getFullscreen = () => fullscreen.getAttribute('aria-pressed') === 'true';
  async function lockLandscape() {
    if (locking || !screen.orientation?.lock) return;
    locking = true;
    try {
      await screen.orientation.lock('landscape');
    } catch {
      // Safari and non-fullscreen browsers can reject the native lock. Creator
      // still rotates its game frame AND touch coordinates into landscape.
    } finally {
      locking = false;
    }
  }
  window.KartDisplay = {
    toggleFullscreen() { fullscreen.click(); },
    getFullscreen,
    setControls(next) { controls = next || {}; },
  };
  for (const action of ['pause', 'settings'])
    document.getElementById(`kart-accessible-${action}`).addEventListener('click', () => controls[action]?.());
  // Native orientation locks usually need fullscreen and/or user activation.
  // Neither is required for Creator's CSS landscape fallback.
  document.addEventListener('game-displaychange', () => {
    if (getFullscreen()) void lockLandscape();
  });
  document.addEventListener('pointerdown', () => { void lockLandscape(); }, { once: true, capture: true });
  window.addEventListener('pageshow', () => { void lockLandscape(); });
  void lockLandscape();
})();</script><section id="kart-loading" aria-label="浪湾卡丁车加载中" aria-busy="true">
      <div class="intro"><h1>浪湾卡丁车</h1>
      <progress aria-label="正在加载游戏"></progress><p id="kart-loading-status" role="status">正在准备出发…</p>
      <button id="kart-loading-retry" type="button" hidden>重新加载</button></div>
    </section><script>(function loadingScreen() {
  const overlay = document.getElementById('kart-loading');
  const status = document.getElementById('kart-loading-status');
  const retry = document.getElementById('kart-loading-retry');
  let engine, settled = false;
  const blockKeys = (event) => {
    if (!event.ctrlKey && !event.metaKey && event.key !== 'Tab' && event.key !== 'F5'
        && event.target !== retry) event.stopImmediatePropagation();
  };
  window.addEventListener('keydown', blockKeys, true);
  const timeout = setTimeout(() => fail(), 60000);
  function cleanup() {
    clearTimeout(timeout);
    engine?.game.off('kart:loaded', loaded);
    engine?.game.off('kart:load-error', fail);
    engine?.director.off(engine.Director.EVENT_AFTER_DRAW, finish);
  }
  function fail() {
    if (settled) return;
    settled = true;
    cleanup();
    engine?.game.pause();
    overlay.setAttribute('aria-busy', 'false');
    status.textContent = '加载未完成，请检查网络后重试';
    overlay.querySelector('progress').hidden = true;
    retry.hidden = false;
  }
  function finish() {
    if (settled) return;
    settled = true;
    cleanup();
    overlay.remove();
    window.removeEventListener('keydown', blockKeys, true);
    document.getElementById('GameDiv').removeAttribute('inert');
    document.getElementById('GameCanvas').focus({ preventScroll: true });
    delete window.KartLoading;
  }
  function loaded() {
    status.textContent = '赛车就绪，正在进入出发准备…';
    engine.director.once(engine.Director.EVENT_AFTER_DRAW, finish);
  }
  retry.addEventListener('click', () => location.reload());
  window.KartLoading = {
    async boot(applicationPath) {
      document.getElementById('GameDiv').setAttribute('inert', '');
      try {
        const canvas = document.getElementById('GameCanvas');
        const bounds = canvas.parentElement.getBoundingClientRect();
        canvas.width = bounds.width;
        canvas.height = bounds.height;
        const { Application } = await System.import(applicationPath);
        engine = await System.import('cc');
        if (settled) return;
        engine.game.onPostBaseInitDelegate.add(() => {
          engine.settings.overrideSettings('splashScreen', 'totalTime', 0);
          engine.settings.overrideSettings('splashScreen', 'logo', { type: 'none' });
          // Set before screen.init(): Creator handles both canvas rotation and
          // touch coordinates, even when the browser refuses orientation.lock.
          engine.settings.overrideSettings('screen', 'orientation', 'landscape');
          engine.settings.overrideSettings('screen', 'exactFitScreen', true);
        });
        engine.game.once('kart:loaded', loaded);
        engine.game.once('kart:load-error', fail);
        status.textContent = '正在装配赛道、赛车与车手…';
        const application = new Application();
        await application.init(engine);
        await application.start();
        if (settled && overlay.isConnected) engine.game.pause();
      } catch (error) {
        fail();
        console.error('[carding-car startup]', error);
      }
    },
  };
})();</script>
