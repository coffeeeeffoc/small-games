<!doctype html>
<html lang="zh-CN"><head>
  <script src="./dev-mode.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7efdd"><title>气球搬家公司 · Balloon Movers</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cellipse cx='20' cy='15' rx='12' ry='14' fill='%23e96851'/%3E%3Cpath d='M20 29q-9 4 0 10' fill='none' stroke='%23153e3d'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"></head>
<body><main class="app">
<header><div class="brand"><span class="brand-balloon" aria-hidden="true"></span><div><p class="eyebrow">BALLOON MOVERS · 搬家营业中</p><h1>气球搬家公司<span>®</span></h1></div></div><div class="stamp">轻拿 · 慢放<br><b>好心情签收</b></div></header>
<nav class="levels" aria-label="选择搬家关卡"><button data-level="0"><span>01</span> 沙发先走</button><button data-level="1"><span>02</span> 冰箱侧身</button><button data-level="2"><span>03</span> 钢琴窄窗</button></nav>
<div class="play-area"><section class="stage" aria-label="搬家现场"><div class="stage-top"><span id="task">第一单 · 沙发</span><div><button id="pause" disabled>暂停</button><button id="mute" aria-pressed="false">声音 开</button><button id="retry">重来 ↻</button></div></div><canvas id="scene" width="760" height="620" aria-label="搬家现场；准备时可拖气球到家具两端，也可使用右侧绑点按钮"></canvas><div class="stage-bottom"><span class="wind">风机开着 <b>→</b></span><output id="flight" data-phase="ready" data-tick="0">准备起飞</output><span id="bumps">轻擦没关系</span></div><div id="result" class="result" hidden><p class="eyebrow" id="result-kicker">DELIVERED WITH CARE</p><h2 id="result-title"></h2><p id="result-text"></p><div><button id="again">调整后重来</button><button id="next" class="primary">下一单 →</button></div></div></section>
<aside class="controls"><div id="prepare"><p class="eyebrow">STEP 01 · 绑好气球</p><h2>大件，也能轻轻搬。</h2><p class="instruction">拖气球到绑环，或点下方「绑一只」。</p><button id="supply" class="supply" aria-label="拿气球，拖到绑环"><span class="tiny-balloon"></span><span>气球仓 <b id="remaining">4</b><small>拖到家具两端</small></span><span>↗</span></button><div class="rig left-rig"><button class="bind" data-side="left">左端 · 绑一只 <b id="left-count">0</b></button><button class="remove" data-remove="left" aria-label="拆下左端一只气球">−</button><button class="rope" data-rope="left">短绳</button></div><div class="rig right-rig"><button class="bind" data-side="right">右端 · 绑一只 <b id="right-count">0</b></button><button class="remove" data-remove="right" aria-label="拆下右端一只气球">−</button><button class="rope" data-rope="right">短绳</button></div><div class="prep-actions"><button id="suggest">推荐绑法</button><button id="clear">全部拆下</button></div><button id="launch" class="primary launch" disabled>起飞，开搬！ <span>↗</span></button></div>
<div id="flying" hidden><p class="eyebrow">STEP 02 · 松手保留浮力</p><h2>听你的，慢慢飞。</h2><p class="instruction">左右轮流按住排气。<br>过窗后多放一点，让家具落下来。</p><div class="valves"><button id="left-valve" class="valve left" aria-label="左排气" aria-pressed="false"><span class="valve-icon">≋</span><strong>左排气<em id="left-balls"></em></strong><small>A · 按住</small><span class="gas-track"><i id="left-gas"></i></span></button><button id="right-valve" class="valve right" aria-label="右排气" aria-pressed="false"><span class="valve-icon">≋</span><strong>右排气<em id="right-balls"></em></strong><small>D · 按住</small><span class="gas-track"><i id="right-gas"></i></span></button></div><p class="small-note">气球只放气，不补气。<br>轻擦可救，落稳才签收。</p></div>
<div class="tip"><span>搬家小贴士</span><p id="hint"></p></div></aside></div>
<footer><span>有气球，就有办法。</span><span>三单小生意 · 一根手指也能搬</span></footer>
</main><script src="./vendor/matter.js"></script><script type="module" src="./game.mjs"></script></body></html>
