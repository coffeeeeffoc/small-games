<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="884" viewBox="0 0 1260 884">
<rect width="1260" height="884" fill="#e2e7db"/><style>text{font-family:system-ui,sans-serif;fill:#2d4439} .phone{fill:#f4f1e7;stroke:#9ba98b;stroke-width:2}.button{fill:#526c46}.white{fill:#fff}.note{font-size:14px;fill:#637657}.label{font-size:20px;font-weight:600}</style>
<g transform="translate(20 20)"><rect class="phone" width="390" height="844" rx="24"/><text x="28" y="58" class="label">同频归航</text><text x="28" y="160" font-size="34">四盏灯，一起回家。</text><text x="28" y="196" class="note">一次滑动，同步四位信使。</text><g fill="#dce6cb"><circle cx="65" cy="315" r="34"/><circle cx="150" cy="315" r="34"/><circle cx="235" cy="315" r="34"/><circle cx="320" cy="315" r="34"/></g><text x="42" y="323" class="label">芽</text><text x="127" y="323" class="label">月</text><text x="212" y="323" class="label">△</text><text x="297" y="323" class="label">◉</text><text x="28" y="442" class="note">已归航 2 / 6 站</text><rect x="28" y="478" width="334" height="56" rx="12" class="button"/><text x="139" y="514" class="white">继续归航 →</text><rect x="28" y="550" width="334" height="52" rx="12" fill="#e1e8d5"/><text x="154" y="582">选择关卡</text><text x="28" y="778" class="note">返回主页保留本轮局面</text></g>
<g transform="translate(435 20)"><rect class="phone" width="390" height="844" rx="24"/><text x="20" y="52">⌂</text><text x="80" y="52" class="label">同频归航</text><rect x="329" y="29" width="5" height="20" fill="#2d4439"/><rect x="340" y="29" width="5" height="20" fill="#2d4439"/><text x="20" y="100" class="label">借一扇风门</text><text x="304" y="100" class="label">06 步</text><text x="20" y="133" class="note">好友自报 10 步 · 同关挑战</text><g fill="#e9eddf" stroke="#c3cfb3"><rect x="16" y="155" width="174" height="193" rx="12"/><rect x="200" y="155" width="174" height="193" rx="12"/><rect x="16" y="358" width="174" height="193" rx="12"/><rect x="200" y="358" width="174" height="193" rx="12"/></g><text x="30" y="183">芽芽 · 已到家 ✓</text><text x="214" y="183">月月 · 归航中</text><text x="30" y="387">棱棱 · 归航中</text><text x="214" y="387">泡泡 · 归航中</text><text x="30" y="589" class="note">芽芽到家了！已归航 1 / 4</text><text x="30" y="654" class="note">任意位置滑动一步 · 双指滚动</text><rect x="16" y="710" width="358" height="108" rx="16" fill="#e1e8d5"/><text x="30" y="742">预览开关</text><text x="30" y="792">↶ 撤销</text><text x="160" y="792">↻ 重来</text><text x="285" y="792">帮助</text></g>
<g transform="translate(850 20)"><rect class="phone" width="390" height="844" rx="24"/><text x="28" y="66" class="label">四盏灯，都到家了。</text><g fill="#dce6cb"><circle cx="65" cy="230" r="34"/><circle cx="150" cy="230" r="34"/><circle cx="235" cy="230" r="34"/><circle cx="320" cy="230" r="34"/></g><text x="112" y="370" font-size="54">8 步</text><text x="68" y="420">比好友自报的成绩少 2 步</text><text x="68" y="452" class="note">获得最优星 ★ · 挑战独立计分</text><rect x="28" y="506" width="334" height="56" rx="12" class="button"/><text x="134" y="541" class="white">再战这一站</text><rect x="28" y="578" width="334" height="52" rx="12" fill="#e1e8d5"/><text x="130" y="610">分享少步挑战</text><text x="154" y="688">返回主页</text><text x="28" y="778" class="note">取消分享后仍可继续游玩</text></g></svg>
