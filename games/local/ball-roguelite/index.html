<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#091725" />
    <title>星轨弹珠 · Orbit Breaker</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./dev-mode.js"></script>

    <script type="module" src="./main.mjs"></script>
  </head>
  <body data-screen="loading">
    <main id="viewport" data-game-display-host>
      <div id="GameDiv">
        <div id="Cocos3dGameContainer">
          <canvas id="GameCanvas" tabindex="0" aria-label="星轨弹珠游戏"></canvas>
        </div>
        <div id="accessibility" aria-label="游戏操作"></div>
      </div>
      <div id="loading" role="status">
        <span class="loading-orb"></span><strong>正在唤醒星光</strong>
      </div>
    </main>
  </body>
</html>
