<div id="app"></div>
<script>
const icons={back:'<path d="m15 5-7 7 7 7"/>',gear:'<path d="m9 3-1 3-3 1v3l-2 2 2 2v3l3 1 1 3h6l1-3 3-1v-3l2-2-2-2V7l-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 8a3 3 0 0 1 6 1c0 2-3 2-3 4m0 4h0"/>',pause:'<rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/>',book:'<path d="M3 4c4-1 6 0 9 2 3-2 5-3 9-2v15c-4-1-6 0-9 2-3-2-5-3-9-2V4Zm9 2v15"/>',list:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/>',undo:'<path d="m7 3-4 4 4 4M3 7h9a7 7 0 0 1 0 14"/>',clear:'<path d="M9 5h11v14H9L3 12l6-7Zm3 4 5 6m0-6-5 6"/>',shuffle:'<path d="M3 6h4l10 12h4m-4-3 4 3-4 3M3 18h4L17 6h4m-4-3 4 3-4 3"/>',hint:'<path d="M8 16c-1-2-3-3-3-6a7 7 0 0 1 14 0c0 3-2 4-3 6m-8 0h8m-8 3h8m-6 3h4"/>'};
const svg=name=>`<svg viewBox="0 0 24 24">${icons[name]}</svg>`;
const icon=(name,label)=>`<button class="icon" aria-label="${label}">${svg(name)}</button>`;
const header=label=>`<div class="top">${icon('back','返回')}<span class="page-label">${label}</span><span style="width:44px"></span></div>`;
const primary=text=>`<button class="primary">${text}<span class="arrow">→</span></button>`;
const art=(type)=>type==='dawn'?`<svg viewBox="0 0 80 80" fill="none"><circle cx="40" cy="29" r="14" fill="#efc46f"/><path d="M40 5v5M17 14l4 4m38-4-4 4m17 11h-5M13 29H8" stroke="#d8a955" stroke-width="3" stroke-linecap="round"/><path d="M15 48c0-4 3-7 7-7h35c4 0 7 3 7 7v17H15V48Z" fill="#f6dfa4" stroke="#d8b276" stroke-width="2"/><path d="M23 48h33M23 53h33" stroke="#e9c887" stroke-width="2"/><ellipse cx="41" cy="54" rx="13" ry="10" fill="#fff9e8"/><circle cx="41" cy="54" r="6" fill="#efc46f"/></svg>`:type==='shore'?`<svg viewBox="0 0 80 80" fill="none"><path d="M10 55c6-5 12-5 18 0s12 5 18 0 12-5 18 0 9 4 13 1M9 65c6-5 12-5 18 0s12 5 18 0 12-5 18 0" stroke="#8cbcac" stroke-width="3" stroke-linecap="round"/><path d="M25 41c-5-16 1-29 16-29 15 0 23 15 18 29L43 54l-18-13Z" fill="#f6d4a5" stroke="#dcbb8f" stroke-width="2"/><path d="m41 18 1 32m-11-27 10 27m12-27L43 50" stroke="#ddbd95" stroke-width="2"/></svg>`:`<svg viewBox="0 0 80 80" fill="none"><path d="M50 13c-16 2-28 17-25 32 4 19 23 24 39 16-25-1-35-26-14-48Z" fill="#e6c985"/><path d="m60 24 3-7 3 7 7 3-7 3-3 7-3-7-7-3 7-3Zm-45 24 2-5 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#a2b299"/><circle cx="22" cy="22" r="3" fill="#becab1"/></svg>`;
const screens={
home:()=>`<section class="screen home"><div class="top"><div class="brand"><span class="brand-mark">w</span><span>词屿</span></div><div class="top-right">${icon('help','怎么玩')}${icon('gear','设置')}</div></div><h1 class="home-title">词屿</h1><p class="home-subtitle">字 母 叠 叠 乐</p><div class="hero"><img src="./island.svg" alt="字母小岛"></div><p class="hero-note">拾起字母，点亮一座单词小岛。</p>${primary('开始拾词')}<div class="entry-grid"><button class="entry"><strong>主题词岛</strong><small>三个单词，一段小冒险</small><span class="entry-icon">✦</span></button><button class="entry study"><strong>学习入口</strong><small>课本单词，轻松练习</small><span class="entry-icon">↗</span></button></div><div class="little-links"><button class="little-link"><span>☀</span>每日词岛</button><button class="little-link"><span>♧</span>好友同题</button></div><p class="footer-note">不计时 · 慢慢来</p></section>`,
islands:()=>`<section class="screen">${header('主题词岛')}<h1 class="page-title">今天，去哪一岛？</h1><p class="subtitle">三个单词，收获一份小快乐。</p><div class="stack" style="margin-top:25px">${[['dawn','早餐开张','备好鸡蛋、牛奶和面包','#f5dfac'],['shore','海边拾光','听海浪，拾贝壳，踩沙滩','#d5e4c7'],['orbit','星空出发','从月亮与星星走向太空','#d8ded0']].map(([id,title,sub,color])=>`<button class="island-card paper"><div class="round-art" style="background:${color}">${art(id)}</div><div><h2>${title}</h2><p>${sub}</p><span class="pill">3 个词 · 随时出发</span></div><span class="chevron">›</span></button>`).join('')}</div><button class="free-card paper"><div style="text-align:left"><h3>自由拾词</h3><p class="caption">随机遇见一组新单词</p></div><span class="chevron">→</span></button><p class="footer-note">每座小岛，都有新的发现</p></section>`,
learning:()=>`<section class="screen">${header('学习入口')}<h1 class="page-title">把单词，慢慢记住。</h1><p class="subtitle">从课本出发，也可以带上自己的词单。</p><div class="learning-hero"><h2>每天一小岛<br>进步一点点</h2><img src="./island.svg" alt=""></div><button class="learning-card paper"><span class="learning-icon">${svg('book')}</span><div><h2>教材练习</h2><p class="caption">选择出版社、年级和单元</p></div><span class="chevron">›</span></button><button class="learning-card paper"><span class="learning-icon" style="background:#f4e8ce">${svg('list')}</span><div><h2>我的词单</h2><p class="caption">用自己的 2–8 个单词练习</p></div><span class="chevron">›</span></button><div class="resume"><span class="caption">继续上次教材练习</span><h3>外研版 · 三年级上册 · Unit 1</h3><div class="progress"><i></i></div><div class="resume-action"><span class="caption">已学 6 词 · 第 2 批</span><button>继续练习 →</button></div></div><p class="footer-note">练习进度自动保存</p></section>`,
play:()=>`<section class="screen play"><div class="top">${icon('back','返回首页')}<div class="play-progress"><span>林间漫游</span><span class="dots">${[1,0,0,0,0,0].map(n=>`<i class="${n?'filled':''}"></i>`).join('')}</span><span>1 / 6</span></div>${icon('pause','暂停')}</div><div class="clue"><div class="clue-top"><span>这一词，怎么拼？</span><span>02 / 06</span></div><h2>花朵</h2><div class="clue-bottom"><span>6 个字母 · 字母都已露出</span></div><button>换词义 ↗</button></div><div class="board">${[['r',37,29,0],['f',108,21,0],['e',187,29,0],['s',257,34,0],['b',45,105,0],['e',119,110,0],['i',193,103,0],['t',263,111,0],['r',33,192,0],['f',111,191,1],['l',184,191,1],['o',253,183,0],['w',42,268,0],['e',120,263,0],['r',192,266,0],['d',263,270,0]].map(([ch,x,y,s],i)=>`<button class="tile ${i<9?'blocked':s?'selected':''}" style="left:${x}px;top:${y}px;transform:rotate(${[-4,3,-2,4][i%4]}deg)">${ch}</button>`).join('')}<span class="board-hint">只拾取完全露出的字母牌</span></div><div class="answer-title"><span>把答案拼在这里</span><span>2 / 6</span></div><div class="answer-row"><div class="slots">${['f','l','','','',''].map(c=>`<button class="slot ${c?'filled':''}">${c}</button>`).join('')}</div><button class="confirm" aria-label="检查拼写">✓</button></div><p class="feedback">点选字母牌，按顺序拼出答案。</p><div class="tools">${[['undo','撤回'],['clear','清空'],['shuffle','重排'],['hint','提示']].map(([id,label])=>`<button class="tool">${svg(id)}${label}</button>`).join('')}</div></section>`,
pause:()=>`<section class="screen">${header('休息一下')}<div class="pause-art"><div class="pause-orbit"><svg viewBox="0 0 24 24">${icons.pause}</svg></div></div><h1 class="pause-title">小岛会等你。</h1><p class="pause-sub">林间漫游 · 已完成 1 / 6 词</p><div class="pause-options">${primary('继续拾词')}<button class="menu-button">换一组单词</button><button class="menu-button">邀请朋友同题</button><button class="menu-button">回到首页</button></div><div class="pause-settings"><button class="quiet" style="flex:1">拾词指南</button><button class="quiet" style="flex:1">声音与显示</button></div><p class="footer-note">随时离开，下次接着拾词</p></section>`,
result:()=>`<section class="screen">${header('本岛收获')}<div class="result-hero"><img src="./island.svg" alt="点亮的小岛"></div><h1 class="result-title">这一岛，拾得漂亮！</h1><p class="result-sub">早餐开张 · 三份收获都找到了</p><div class="result-list paper">${[['egg','鸡蛋'],['milk','牛奶'],['bread','面包']].map(([w,m])=>`<div class="result-word"><strong>${w}</strong><span>${m}<span class="tick">✓</span></span></div>`).join('')}</div><div class="result-actions">${primary('去下一座词岛')}<button class="secondary" style="margin-top:16px">再练一遍</button><button class="quiet">分享给朋友 · 邀请同题 ↗</button><button class="quiet" style="margin-top:0">返回首页</button></div></section>`,
book:()=>`<section class="screen book">${header('教材练习')}<h1 class="page-title">今天练哪一单元？</h1><p class="subtitle">核对教材版次，开始一小组练习。</p><div class="book-fields">${[['出版社','外语教学与研究出版社'],['年级','三年级'],['教材与册次','孙有中 · 三年级上册（2022课标）'],['学习单元','Unit 1']].map(([label,value])=>`<div class="field"><label>${label}</label><select><option>${value}</option></select></div>`).join('')}</div><div class="evidence">已对照原书核验 · 每批最多 6 词<br>所选词库下载后可离线练习。<div style="margin-top:8px;color:#526e50">查看教材来源与词表范围 ↗</div></div>${primary('开始单元练习')}<button class="quiet" style="margin-top:13px">刷新教材目录</button></section>`,
custom:()=>`<section class="screen custom">${header('我的词单')}<h1 class="page-title">带上你的单词，出发。</h1><p class="subtitle">每行一个英文单词和中文含义。</p><p class="textarea-label">我的词单 <span style="font-size:12px;color:#8b9781;font-weight:400;float:right">2–8 个单词或短语</span></p><textarea class="textarea">apple 苹果\nforest 森林\ncan't 不能\nice-cream 冰淇淋</textarea><div class="note-card">英文和中文用空格或逗号分隔。<br>支持短语、撇号和连字符，合计最多 80 个字母和符号。</div>${primary('用这组词开始')}<button class="quiet" style="margin-top:15px">返回学习入口</button><p class="footer-note">用熟悉的词，玩一座自己的小岛</p></section>`,
help:()=>`<section class="screen help">${header('拾词指南')}<h1 class="page-title">三步，点亮一座岛。</h1><p class="subtitle">不计时，不限次数，慢慢来。</p>${[['看词义，选目标','先看中文词义。想换一个目标，点「换词义」查看本局词单。'],['拾起完全露出的字母','按拼写顺序点击亮色字母牌。被压住的牌，等上层消失后就能拾起。'],['拼对整词，消除一层','填满答案会自动检查，拼对后一起消失。点答案格可撤销，也能清空、重排或查看提示。']].map(([title,body],i)=>`<div class="help-item paper"><span class="help-number">0${i+1}</span><div><h2>${title}</h2><p>${body}</p></div></div>`).join('')}<div class="note-card" style="margin-top:19px">重复字母要分别选择。空格自动补齐，撇号和连字符也要拼入答案。</div>${primary('知道了，去拾词')}<p class="footer-note">也支持键盘 Tab · 空格 · Backspace · Enter</p></section>`,
share:()=>`<section class="screen share">${header('邀请朋友')}<div class="share-art"><div class="share-card"><img src="./island.svg" alt=""><strong>同一岛，一起拾词</strong></div></div><h1 class="share-title">把这座小岛<br>送给一个朋友。</h1><p class="subtitle">同一组单词，各自慢慢发现答案。</p><p class="link-label">同题链接</p><input class="link-input" value="https://…/letters-words2/?mini=dawn&v=1" readonly>${primary('复制同题链接')}<button class="quiet">返回小岛</button><div class="note-card" style="margin-top:30px">小游戏平台将使用宿主分享入口；<br>H5 可直接复制链接或使用系统分享。</div><p class="footer-note">早餐开张 · 3 个词</p></section>`
};
screens.friend=()=>`<section class="screen">${header('好友同题')}<h1 class="page-title">一起，开一座词岛。</h1><p class="subtitle">同一组单词，和朋友来一场轻松比拼。</p><div class="learning-hero" style="height:177px"><h2>叫上朋友<br>看看谁先点亮</h2><img src="./island.svg" alt=""></div><div class="paper" style="padding:21px;margin-top:23px"><h2 style="font-size:18px;margin-bottom:9px">创建好友房间</h2><p class="caption">选好一组单词，分享房间邀请。</p><div style="margin-top:20px">${primary('创建房间')}</div></div><div class="paper" style="padding:21px;margin-top:17px"><h2 style="font-size:18px;margin-bottom:13px">加入朋友的房间</h2><input class="link-input" placeholder="输入房间码"><button class="secondary" style="margin-top:15px">加入房间 →</button></div><p class="footer-note">单人拾词也可以从首页随时开始</p></section>`;
screens.settings=()=>`<section class="screen">${header('设置')}<h1 class="page-title">按自己的节奏。</h1><p class="subtitle">声音与显示</p><div class="paper" style="padding:16px 20px;margin-top:22px;display:flex;align-items:center;justify-content:space-between;min-height:103px"><div><strong>游戏音效</strong><p class="caption" style="margin-top:5px">字母轻响，拼对有回应</p></div><button class="icon" style="background:#e8eddd" aria-label="开启音效"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="m16 9 5 6m0-6-5 6"/></svg></button></div><div class="paper" style="padding:16px 20px;margin-top:22px;display:flex;align-items:center;justify-content:space-between;min-height:103px"><div><strong>完整游戏画面</strong><p class="caption" style="margin-top:5px">浏览器全屏显示</p></div><button class="quiet">全屏 ↗</button></div><p class="footer-note">不计时 · 不限次数</p></section>`;
const labels={settings:'12 设置',friend:'11 好友同题',home:'01 首页',islands:'02 主题词岛',learning:'03 学习入口',book:'04 教材选择',play:'05 核心游玩',pause:'06 暂停',result:'07 结算',custom:'08 我的词单',help:'09 帮助',share:'10 同题分享'};
const query=new URLSearchParams(location.search);const page=query.get('page')||'home';
if(page==='contact'){document.documentElement.classList.add('contact-mode');document.querySelector('#app').innerHTML='<main class="contact">'+Object.keys(labels).filter(k=>!['friend','settings'].includes(k)).map(k=>`<div class="contact-item"><h2>${labels[k]}</h2><iframe src="?page=${k}"></iframe></div>`).join('')+'</main>';}else document.querySelector('#app').innerHTML=(screens[page]||screens.home)();
</script></html>
