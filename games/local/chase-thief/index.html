<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#173e3d" />
    <title>追贼别撞墙 · 无尽城市追逐</title>
    <link rel="icon" href="./art/icon.png" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./dev-mode.js"></script>

    <script type="module" src="./bootstrap.mjs"></script>
  </head>
  <body data-phase="loading">

    <main id="game" data-ready="false" data-game-display-host>
      <div id="GameDiv">
        <div id="Cocos3dGameContainer">
          <canvas
            id="GameCanvas"
            tabindex="0"
            aria-label="追贼别撞墙，左右滑动换道，上滑跳跃，下滑滑铲；键盘方向键也可操作"
          ></canvas>
        </div>
      </div>
      <div id="loading" role="status">
        <img src="./art/icon.png" alt="" width="128" height="128" /><strong>前面的，别跑！</strong>
        <p>正在走进老城街区…</p>
        <button hidden onclick="location.reload()">重新加载</button>
      </div>
    </main>
  </body>
</html>
