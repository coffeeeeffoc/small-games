<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#061d2a" />
    <title>水位联动站 · Waterline Station</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-screen="loading">
    <main id="stage" aria-label="水位联动站">
      <div id="GameDiv">
        <div id="Cocos3dGameContainer">
          <canvas id="GameCanvas" aria-label="水位联动站游戏场景"></canvas>
        </div>
      </div>
      <div id="accessibility" aria-label="游戏操作"></div>
      <div id="loading" role="status">
        <img src="./icon.svg" width="72" height="72" alt="" />
        <h1>水位联动站</h1>
        <p id="loading-message">正在点亮港口灯火…</p>
        <button id="load-retry" hidden>重新加载</button>
      </div>
      <dialog id="share-fallback" aria-labelledby="share-heading">
        <h2 id="share-heading">复制挑战链接</h2>
        <p>长按下方链接选择并复制，发给好友。</p>
        <textarea id="share-url" readonly aria-label="挑战链接"></textarea
        ><button id="share-select">选择链接</button><button id="share-close">返回结算</button>
      </dialog>
      <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
    </main>
    <script src="./dev-mode.js"></script>
    <script type="module" src="./game.mjs"></script>
  </body>
</html>
