plugins {
    id 'com.android.application'
}

android {
    namespace 'com.coffeeeeffoc.smallgames'
    compileSdk 34

    defaultConfig {
        applicationId 'com.coffeeeeffoc.smallgames'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '2')
        versionName System.getenv('APP_VERSION') ?: '0.2.0'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/assets')
}

// Both Android Studio and the CLI package the same freshly built Web Shell.
tasks.register('bundleWeb', Exec) {
    workingDir rootProject.projectDir.parentFile.parentFile
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'pnpm', 'build:pages'
    } else {
        commandLine 'pnpm', 'build:pages'
    }
    environment 'GOMAXPROCS', '1'
}
tasks.register('syncWeb', Sync) {
    dependsOn 'bundleWeb'
    from rootProject.file('../shell-web/dist')
    exclude 'mobile/**'
    into layout.buildDirectory.dir('generated/assets/web')
}
tasks.named('preBuild') { dependsOn 'syncWeb' }

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
